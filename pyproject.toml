[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-sniper"
version = "0.1.0"
description = "Self-hosted eBay auction sniping service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "apscheduler>=3.10.4",
    "sqlalchemy>=2.0.0",
    "httpx>=0.26.0",
    "typer>=0.9.0",
    "jinja2>=3.1.3",
    "python-telegram-bot>=21.0",
    "mcp>=0.9.0",
    "python-dotenv>=1.0.0",
    "ntplib",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
sniper = "sniper.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"