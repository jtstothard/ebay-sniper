version: 2
# Each ecosystem gets one patch/minor group and one major group, so Dependabot
# opens at most two PRs per ecosystem a week. When a major breaks the build,
# add an ignore for it instead of leaving the major group red.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      pip-patch-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      pip-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-patch-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      docker-major:
        patterns:
          - "*"
        update-types:
          - major
