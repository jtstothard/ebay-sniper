version: 2
# Each ecosystem gets one patch/minor group and one major group (pip gets a
# single group, see below), so Dependabot opens at most two PRs per
# ecosystem a week. When a major breaks the build, add an ignore for it
# instead of leaving the major group red.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One group with no update-types filter. These requirements are ranges
    # with no lockfile, so Dependabot can't tell a patch from a major
    # ("update X requirement to permit the latest version"). An update-types
    # filter matches none of them, and each one opens its own PR.
    groups:
      pip:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-patch-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      docker-major:
        patterns:
          - "*"
        update-types:
          - major
